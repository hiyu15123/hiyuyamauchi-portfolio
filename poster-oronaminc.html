<!DOCTYPE html>
<html lang="ja">
<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://use.typekit.net/umk2pba.css">

    <header class="l-header" id="l-header"></header>
    <script>
        fetch('include/header.html')
            .then(response => response.text())
            .then(html => {
            document.getElementById('l-header').innerHTML = html;
        });
    </script>
    <main>
        <section class="l-section p-work">
            <div class="l-inner">
                <ul class="p-work__breadcrumb">

                    <li>GRAPHIC-WORKS | オロナミンCポスター</li>

                    <div class="p-work__card">
                        <h2 class="p-work__title">作品名</h2>
                        <p>オロナミンCポスター</p>
                    </div>
                    <div class="p-work__card">

                    <div class="p-work__card">
                        <h2 class="p-work__title">使用技術</h2>

                    </div>
                    <div class="p-work__card">

                </div>
                <div class="p-work__pagination">
                    <a href="poster-ukraine.html" class="p-work__prev">前の作品を見る</a>
                    <p>4 / 4</p>
                    <a href="banner.html" class="p-work__next">次の作品を見る</a>

            </div>
        </section>

    <footer class="l-footer" id="l-footer"></footer>
    <script>
        fetch('include/footer.html')
            .then(response => response.text())
            .then(html => {
            document.getElementById('l-footer').innerHTML = html;
