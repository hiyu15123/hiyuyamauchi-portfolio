<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="専門学校の課題として制作した、ケンタッキー・フライドチキンのクリスマスバナー。">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://use.typekit.net/umk2pba.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>GRAPHIC-WORKS クリスマスバナー | HIYU YAMAUCHI</title>
</head>
<body>
    <header class="l-header" id="l-header"></header>
    <script>
        fetch('include/header.html')
            .then(response => response.text())
            .then(html => {
            document.getElementById('l-header').innerHTML = html;
        });
    </script>
    <main>
        <section class="l-section p-work">
            <div class="l-inner">
                <nav class="p-work__breadcrumb" aria-label="パンくずリスト">
                    <ol>
                        <li><a href="index.html">TOP</a></li>
                        <li aria-current="page">GRAPHIC-WORKS | クリスマスバナー</li>
                    </ol>
                </nav>
                <h1 class="p-work__heading">クリスマスバナー</h1>
                <p class="p-work__thumb -contain"><img src="assets/img/banner.png" alt="ケンタッキー・フライドチキンのクリスマスバナー"></p>
                <div class="p-work__content">
                    <div class="p-work__card">
                        <h2 class="p-work__title">作品概要</h2>
                        <p>ケンタッキーのクリスマスバナーを作成しました。クリスマスのシーズンで早く予約すると割引でお得に買えるバナーです。</p>
                    </div>
                    <div class="p-work__card">
                        <h2 class="p-work__title">アピール・こだわり</h2>
                        <p>サンタクロースとトナカイのイラストを使って暖かい雰囲気を演出しました。</p>
                    </div>
                    <div class="p-work__card">
                        <h2 class="p-work__title">使用技術</h2>
                        <p>Adobe Illustrator</p>
                    </div>
                    <div class="p-work__card">
                        <h2 class="p-work__title">制作時間</h2>
                        <p>3時間 (2021.12)</p>
                    </div>
                </div>
                <div class="p-work__pagination">
                    <a href="poster-oronaminc.html" class="p-work__prev">前の作品を見る</a>
                    <p>1 / 4</p>
                    <a href="tabroid.html" class="p-work__next">次の作品を見る</a>
                </div>
            </div>
        </section>
    </main>
    <footer class="l-footer" id="l-footer"></footer>
    <script>
        fetch('include/footer.html')
            .then(response => response.text())
            .then(html => {
            document.getElementById('l-footer').innerHTML = html;
        });
    </script>
</body>
</html>
